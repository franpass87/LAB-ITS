<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Food Content Creation Lab</title><script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script></head><body style="margin:0;background:#f4efe6"><script>(async()=>{try{const parts=await Promise.all([1,2,3,4,5,6,7,8].map(async n=>{const r=await fetch(`c${n}.txt`,{cache:'no-store'});if(!r.ok)throw new Error(`c${n}.txt: ${r.status}`);return (await r.text()).trim()}));const raw=atob(parts.join(''));const bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);let html;if(typeof DecompressionStream==='function'){const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));html=await new Response(stream).text()}else{if(!window.pako)throw new Error('Decompressione non disponibile');html=window.pako.ungzip(bytes,{to:'string'})}document.open();document.write(html);document.close()}catch(e){console.error(e);document.body.innerHTML='<div style="font-family:Arial,sans-serif;padding:40px;max-width:700px;margin:auto"><h2>Errore di caricamento</h2><p>'+String(e.message||e)+'</p><p>Ricarica la pagina. Se il problema continua, il laboratorio verrà aggiornato automaticamente.</p></div>'}})()</script></body></html>
