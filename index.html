<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Food Content Creation Lab</title></head><body style="margin:0;background:#f4efe6"><script>Promise.all([fetch('template.html').then(r=>r.text()),Promise.all(Array.from({length:12},(_,i)=>fetch(`imgpart${i+1}.txt`).then(r=>r.text()))).then(a=>JSON.parse(a.join('')))]).then(([html,imgs])=>{for(const [name,data] of Object.entries(imgs))html=html.split('lab_assets/'+name).join(data);document.open();document.write(html);document.close()}).catch(e=>{document.body.innerHTML='<div style="font-family:sans-serif;padding:40px"><h1>Errore di caricamento</h1><p>'+e.message+'</p></div>'})</script></body></html>
